name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "sidestore/**"
      - ".github/workflows/sidestore.yml"
      - "Packages/SonarDSP/prototype/**"
      - "training/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS-26-SDK, sonst alte Tab-Leiste im Kompatibilitätsmodus)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test SonarDSP
        run: swift test --package-path Packages/SonarDSP -c release

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SleepSonar.xcodeproj \
            -scheme SleepSonar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log; exit 1; }
          test -d build/dd/Build/Products/Release-iphoneos/SleepSonar.app
          cp -R build/dd/Build/Products/Release-iphoneos/SleepSonar.app build/

      - name: Set version (patch = Build-Nummer)
        run: |
          PL=build/SleepSonar.app/Info.plist
          BASE=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PL")
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$PL"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PL"
          for EX in build/SleepSonar.app/PlugIns/*.appex; do
            /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$EX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${GITHUB_RUN_NUMBER}" "$EX/Info.plist"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### SleepSonar $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Ad-hoc sign with entitlements (AltStore re-signs later)
        run: |
          for EX in build/SleepSonar.app/PlugIns/*.appex; do codesign --force --sign - "$EX"; done
          codesign --force --sign - \
            --entitlements SleepSonar/SleepSonar.entitlements \
            build/SleepSonar.app
          codesign -d --entitlements - build/SleepSonar.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/SleepSonar.app Payload/
          zip -qry SleepSonar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepSonar-ipa
          path: SleepSonar.ipa

      - name: Release + SideStore-Quelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES=$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D')
          python3 scripts/make_source.py --ipa SleepSonar.ipa \
            --entitlements SleepSonar/SleepSonar.entitlements \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --notes "$NOTES" --out source.json
          gh release create "$TAG" SleepSonar.ipa source.json \
            --title "SleepSonar $VERSION" --notes "$NOTES" --latest
          echo "Quelle: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
