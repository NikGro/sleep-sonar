name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project SleepSonar.xcodeproj \
            -target SleepSonar \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign with entitlements (AltStore re-signs later)
        run: |
          codesign --force --sign - \
            --entitlements SleepSonar/SleepSonar.entitlements \
            build/Release-iphoneos/SleepSonar.app
          codesign -d --entitlements - build/Release-iphoneos/SleepSonar.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SleepSonar.app Payload/
          zip -qry SleepSonar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepSonar-ipa
          path: SleepSonar.ipa
