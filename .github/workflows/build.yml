name: Build IPA

on:
  push:
    branches: [main, "dev/**"]   # dev-Zweige: nur bauen und IPA als Artefakt, kein Release
    paths-ignore:
      - "**.md"
      - "sidestore/**"
      - ".github/workflows/sidestore.yml"
      - "Packages/SonarDSP/prototype/**"
      - "training/**"
      - "server/**"
      - ".github/workflows/server-tests.yml"
      - ".github/workflows/cleanup-releases.yml"
      - ".github/workflows/app-tests.yml"
      - "SuyaTests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS-26-SDK, sonst alte Tab-Leiste im Kompatibilitätsmodus)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test SonarDSP
        run: swift test --package-path Packages/SonarDSP -c release

      - name: Übersetzungen erzeugen und prüfen
        run: python3 scripts/gen_strings.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Suya.xcodeproj \
            -scheme Suya \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log; exit 1; }
          test -d build/dd/Build/Products/Release-iphoneos/Suya.app
          cp -R build/dd/Build/Products/Release-iphoneos/Suya.app build/

      - name: Set version (Jahr.Monat.laufende Nummer im Monat, z. B. 26.11.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PL=build/Suya.app/Info.plist
          YM="$(TZ=Europe/Berlin date +%y).$(TZ=Europe/Berlin date +%-m)"
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
                 | sed -n "s/^v${YM//./\\.}\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
          VERSION="$YM.$(( ${LAST:-0} + 1 ))"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$PL"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PL"
          for EX in build/Suya.app/PlugIns/*.appex; do
            /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$EX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${GITHUB_RUN_NUMBER}" "$EX/Info.plist"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### Suya $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Ad-hoc sign with entitlements (AltStore re-signs later)
        run: |
          for EX in build/Suya.app/PlugIns/*.appex; do codesign --force --sign - "$EX"; done
          codesign --force --sign - \
            --entitlements Suya/Suya.entitlements \
            build/Suya.app
          codesign -d --entitlements - build/Suya.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Suya.app Payload/
          zip -qry Suya.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Suya-ipa
          path: Suya.ipa

      - name: Release + SideStore-Quelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES=$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D')
          python3 scripts/make_source.py --ipa Suya.ipa \
            --entitlements Suya/Suya.entitlements \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --notes "$NOTES" --out source.json
          gh release create "$TAG" Suya.ipa source.json \
            --title "Suya $VERSION" --notes "$NOTES" --latest
          echo "Quelle: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
