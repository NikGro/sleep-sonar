name: SleepSonar
options:
  bundleIdPrefix: de.nikgro
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
packages:
  SonarDSP:
    path: Packages/SonarDSP
targets:
  SleepSonar:
    type: application
    platform: iOS
    sources: [SleepSonar, Shared]
    dependencies:
      - package: SonarDSP
      - target: SomnivoWidgets
    scheme: {}
    info:
      path: SleepSonar/Info.plist
      properties:
        CFBundleDisplayName: Somnivo
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.nikgro.sleepsonar.sounds]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Somnivo nimmt nachts Atem- und Bewegungsgeräusche auf, um deinen Schlaf auszuwerten. Die Aufnahmen bleiben auf deinem iPhone, bis du sie selbst teilst."
        NSHealthShareUsageDescription: "Somnivo liest die Schlafphasen deiner Apple Watch, um sie mit der eigenen Schätzung zu vergleichen."
        NSHealthUpdateUsageDescription: "Somnivo schreibt deine Schlafphasen (Wach, Kern, Tief, REM) in Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar
        CODE_SIGN_ENTITLEMENTS: SleepSonar/SleepSonar.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SomnivoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Somnivo
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar.widgets
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
