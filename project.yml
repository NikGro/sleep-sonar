name: SleepSonar
options:
  bundleIdPrefix: de.nikgro
  deploymentTarget:
    iOS: "17.0"
packages:
  SonarDSP:
    path: Packages/SonarDSP
targets:
  SleepSonar:
    type: application
    platform: iOS
    sources: [SleepSonar]
    dependencies:
      - package: SonarDSP
    scheme: {}
    info:
      path: SleepSonar/Info.plist
      properties:
        CFBundleDisplayName: Silent Night
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Silent Night nimmt nachts Atem- und Bewegungsgeräusche auf, um deinen Schlaf auszuwerten. Die Aufnahmen bleiben auf deinem iPhone, bis du sie selbst teilst."
        NSHealthShareUsageDescription: "Silent Night liest die Schlafphasen deiner Apple Watch, um sie mit der eigenen Schätzung zu vergleichen."
        NSHealthUpdateUsageDescription: "Silent Night schreibt deine Schlafphasen (Wach, Kern, Tief, REM) in Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar
        CODE_SIGN_ENTITLEMENTS: SleepSonar/SleepSonar.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
