name: Suya
options:
  bundleIdPrefix: de.nikgro
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
packages:
  SonarDSP:
    path: Packages/SonarDSP
targets:
  Suya:
    type: application
    platform: iOS
    sources: [Suya, Shared]
    dependencies:
      - package: SonarDSP
      - target: SuyaWidgets
    scheme:
      testTargets: [SuyaTests]
    info:
      path: Suya/Info.plist
      properties:
        CFBundleDisplayName: Suya
        CFBundleShortVersionString: "26.11.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, it, pt-BR, nl, ja, ko, zh-Hans]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.nikgro.sleepsonar.sounds]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Suya nimmt nachts Atem- und Bewegungsgeräusche auf, um deinen Schlaf auszuwerten. Die Aufnahmen bleiben auf deinem iPhone, bis du sie selbst teilst."
        NSAlarmKitUsageDescription: "Suya weckt dich im eingestellten Zeitraum, sobald du leicht schläfst."
        NSHealthShareUsageDescription: "Suya liest die Schlafphasen deiner Apple Watch, um sie mit der eigenen Schätzung zu vergleichen."
        NSHealthUpdateUsageDescription: "Suya schreibt deine Schlafphasen (Wach, Kern, Tief, REM) in Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar
        CODE_SIGN_ENTITLEMENTS: Suya/Suya.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SuyaWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Suya
        CFBundleShortVersionString: "26.11.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, it, pt-BR, nl, ja, ko, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar.widgets
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
  SuyaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SuyaTests]
    dependencies:
      - target: Suya
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: de.nikgro.sleepsonar.tests
