<h1>用声音了解睡眠</h1>
<p>夜里，Suya 守在你身边静静聆听：根据呼吸、动作和声音估计你的睡眠阶段，在浅睡时轻柔地叫醒你，并把这一夜记入 Apple 健康——手腕上不必戴表。</p>
<div class="card"><p><strong>你的夜晚留在你的 iPhone 上。</strong> 没有账户、没有广告、没有跟踪。只有在你明确选择时，你才会捐赠一幅粗略的夜间声音图（不含声音），让 Suya 对所有人更准确。</p></div>
<p class="muted">Suya 不是医疗器械。</p>
